<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모여봐요 찰스의 숲</title>
<meta name="description" content="은하수가 보이는 숲속 호숫가, 모닥불 앞에서 불멍하는 힐링 웹 게임">
<meta property="og:title" content="모여봐요 찰스의 숲">
<meta property="og:description" content="숲속 호숫가 모닥불 앞에 모여 불멍하는 힐링 메타버스">
<meta property="og:image" content="https://myc2102-hue.github.io/assets/keyart.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🔥%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --panel: rgba(8, 14, 18, 0.62);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f1e9d8;
    --dim: rgba(241, 233, 216, 0.6);
    --accent: #ffb25a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #03070c; color: var(--text); font-family: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 8px; z-index: 5; transition: opacity .6s, transform .6s; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #status { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; color: var(--dim); }
  #status b { color: var(--text); font-weight: 600; }
  #fuelBar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  #fuelBar i { display: block; height: 100%; width: 60%; border-radius: 3px; background: linear-gradient(90deg, #ff6a1a, #ffc04a); transition: width .4s; }
  #sleepInfo { color: var(--accent); }
  .primaryRow { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
  #secondary { padding-top: 0; }
  button, select, input[type=range] { font: inherit; color: inherit; }
  .btn { flex: 1 1 auto; min-width: 86px; padding: 10px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.06); cursor: pointer; font-size: 14px; transition: background .2s; }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: rgba(255, 150, 60, 0.22); border-color: rgba(255,170,90,0.4); }
  details { padding: 0 12px 10px; }
  summary { cursor: pointer; list-style: none; padding: 8px 0 4px; font-size: 13px; color: var(--dim); }
  summary::-webkit-details-marker { display: none; }
  summary { display: inline-flex; align-items: center; gap: 5px; }
  summary .gear { transition: transform .4s; }
  details[open] summary .gear { transform: rotate(90deg); }
  .mix { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; }
  .mix input[type=range] { width: 100%; accent-color: var(--accent); }
  .mix select { background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }

  #presence { position: fixed; right: 14px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 7px; padding: 6px 12px; font-size: 13px; color: var(--dim); transition: opacity .6s; }
  #presence i { width: 8px; height: 8px; border-radius: 50%; background: #5ddc7a; box-shadow: 0 0 8px #5ddc7a; animation: pulse 2s ease-in-out infinite; }
  #presence.off i { background: #8a8a8a; box-shadow: none; animation: none; }
  #presence b { color: var(--text); font-size: 15px; font-weight: 700; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  body.idle #presence { opacity: 0.18; }
  body.cinema #presence { opacity: 0; }
  #hint { position: fixed; right: 14px; top: 50px; font-size: 12px; color: var(--dim); z-index: 5; transition: opacity .6s; text-align: right; line-height: 1.5; }
  #title { position: fixed; left: 16px; top: 12px; z-index: 5; font-size: 14px; letter-spacing: .02em; color: var(--dim); transition: opacity .6s; }
  #title b { color: var(--text); font-weight: 600; }

  body.cinema #hud, body.cinema #hint, body.cinema #title { opacity: 0; pointer-events: none; }
  #exitCinema { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 6; padding: 8px 14px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .8s 1.5s; }
  body.cinema #exitCinema { opacity: .55; pointer-events: auto; }

  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 4; transition: opacity 3s; }
  #toast { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; opacity: 0; transition: opacity .4s; z-index: 7; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  #worry { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px)); padding: 16px; z-index: 8; display: none; flex-direction: column; gap: 10px; }
  #worry[data-open] { display: flex; }
  #worry p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.5; }
  #worry textarea { width: 100%; min-height: 90px; resize: none; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--text); font: inherit; font-size: 14px; }
  #worry .row { display: flex; gap: 6px; justify-content: flex-end; }
  #worry .row .btn { flex: 0 0 auto; }

  .paper { position: fixed; z-index: 6; width: 120px; padding: 8px; background: #f5ecd6; color: #3b2f22; font-size: 11px; line-height: 1.4; border-radius: 3px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); pointer-events: none; overflow: hidden; max-height: 70px; }
  .smokeText { position: fixed; z-index: 6; transform: translate(-50%, 0); color: rgba(220, 220, 230, 0.9); font-size: 14px; max-width: 260px; text-align: center; pointer-events: none; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

  /* 상단을 스르륵 지나가는 한 줄 */
  #quote { position: fixed; left: 0; right: 0; top: 26%; pointer-events: none; z-index: 4; display: flex; justify-content: center; }
  #quoteText { max-width: min(680px, 84vw); text-align: center; font-size: 19px; line-height: 1.6; letter-spacing: .02em; color: rgba(255, 240, 214, 0.95); text-shadow: 0 1px 12px rgba(0,0,0,0.85), 0 0 28px rgba(255,180,90,0.3); opacity: 0; will-change: transform, opacity, filter; }
  #quoteText.go { animation: quoteBreath var(--qdur, 10s) ease-in-out forwards; }
  @keyframes quoteBreath {
    0% { opacity: 0; transform: translateY(14px) scale(0.94); filter: blur(8px); }
    14% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    70% { opacity: 1; transform: translateY(-4px) scale(1.01); filter: blur(0); }
    100% { opacity: 0; transform: translateY(-46px) scale(1.08); filter: blur(14px); }
  }
  @media (max-width: 720px) { #quote { top: 22%; } #quoteText { font-size: 15px; } }

  /* 사람들 */
  #online { color: var(--dim); white-space: nowrap; }
  #emotes { display: flex; align-items: center; gap: 4px; padding: 0 8px 8px; flex-wrap: wrap; }
  .emo { width: 36px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); cursor: pointer; font-size: 17px; line-height: 1; padding: 0; }
  .emo:hover { background: rgba(255,255,255,0.12); }
  #moveHint { margin-left: auto; font-size: 11px; color: var(--dim); }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .tag { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; will-change: transform; }
  .tag .nm { font-size: 11px; color: rgba(241,233,216,0.75); text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  .tag .nm.me { color: var(--accent); }
  .tag .bb { max-width: 220px; white-space: normal; text-align: center; font-size: 13px; padding: 6px 10px; border-radius: 12px; background: rgba(241,233,216,0.9); color: #2a1f14; opacity: 0; transition: opacity .3s; }
  .tag .bb.on { animation: bubble 6s ease-out forwards; }
  @keyframes bubble { 0% { opacity: 0; transform: translateY(6px); filter: blur(0); } 8% { opacity: 1; transform: translateY(0); } 70% { opacity: .9; filter: blur(0); } 100% { opacity: 0; transform: translateY(-28px); filter: blur(5px); } }
  .tag .em { font-size: 26px; opacity: 0; }
  .tag .em.on { animation: emote 2.2s ease-out forwards; }
  @keyframes emote { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 15% { opacity: 1; transform: translateY(0) scale(1.1); } 80% { opacity: 1; transform: translateY(-6px) scale(1); } 100% { opacity: 0; transform: translateY(-22px) scale(.9); } }
  body.cinema #labels { opacity: 0; }

  /* 대문(타이틀) 화면 */
  #gate { position: fixed; inset: 0; z-index: 20; background: #0a1a3a; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; transition: opacity 1.4s ease; }
  #gate.hide { opacity: 0; pointer-events: none; }
  #gateArt { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 45%; }
  #gate::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(180deg, rgba(5,10,22,0) 0%, rgba(5,10,22,0.78) 100%); pointer-events: none; }
  #gateBody { position: relative; z-index: 1; text-align: center; padding: 0 20px max(48px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #gateFallback { display: none; font-size: clamp(36px, 8vw, 72px); font-weight: 800; line-height: 1.15; color: #fff2cf; text-shadow: 0 4px 24px rgba(0,0,0,0.6); margin-bottom: 8px; }
  #gate.noart #gateFallback { display: block; }
  #gate.noart { background: radial-gradient(ellipse at 50% 80%, #4a2a10 0%, #0b1a14 45%, #050b14 100%); }
  #gateTag { font-size: 15px; color: rgba(255,245,225,0.85); text-shadow: 0 2px 10px rgba(0,0,0,0.6); margin: 0; }
  #enter { position: relative; padding: 15px 44px; font-size: 18px; font-weight: 700; color: #2a1a08; background: linear-gradient(180deg, #ffd27a, #ff9b3a); border: none; border-radius: 999px; box-shadow: 0 8px 30px rgba(255,150,60,0.45), inset 0 1px 0 rgba(255,255,255,0.6); cursor: pointer; transition: transform .15s; animation: breathe 2.8s ease-in-out infinite; }
  #enter:hover { transform: translateY(-2px); }
  @keyframes breathe { 0%, 100% { box-shadow: 0 8px 30px rgba(255,150,60,0.4); } 50% { box-shadow: 0 8px 44px rgba(255,170,80,0.75); } }
  #gateNote { font-size: 12px; color: rgba(255,245,225,0.55); margin: 0; }
  #toast { z-index: 30; }
  #gateName { width: min(300px, 80vw); padding: 12px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(10,16,28,0.6); color: var(--text); font: inherit; font-size: 16px; text-align: center; outline: none; }
  #gateName:focus { border-color: var(--accent); }
  #gateName.shake { animation: shake .4s; border-color: #ff7a7a; }
  #avatarTag { margin: 4px 0 -4px; font-size: 13px; color: rgba(255,245,225,0.8); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  #avatars { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #avatars .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: min(520px, 90vw); }
  .av { width: 44px; height: 44px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.18); background: rgba(10,16,28,0.55); cursor: pointer; padding: 0; overflow: hidden; transition: transform .15s, border-color .15s; }
  .av img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto; display: block; }
  @media (max-width: 480px) { .av { width: 38px; height: 38px; } }
  .av:hover { transform: translateY(-2px); }
  .av[aria-checked="true"] { border-color: var(--accent); background: rgba(255,178,90,0.25); box-shadow: 0 0 14px rgba(255,178,90,0.4); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* 채팅 */
  #chat { display: flex; gap: 6px; padding: 8px; }
  #chatText { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--text); font: inherit; font-size: 14px; }
  #chatText:focus { outline: none; border-color: rgba(255,178,90,0.6); }
  #chat .btn { flex: 0 0 auto; }
  #chatLog { position: fixed; left: 16px; top: 44px; z-index: 5; display: flex; flex-direction: column; gap: 4px; max-width: min(320px, 60vw); pointer-events: none; transition: opacity .6s; }
  #chatLog div { font-size: 13px; color: var(--text); text-shadow: 0 1px 4px rgba(0,0,0,0.9); animation: logfade 12s forwards; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chatLog b { color: var(--accent); font-weight: 600; }
  @keyframes logfade { 0%, 75% { opacity: .95; } 100% { opacity: 0; } }
  body.cinema #chatLog { opacity: 0; }

  /* 작은 창: 메뉴 접기 버튼, 가만히 두면 UI 흐려짐 */
  #hudToggle { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; height: 36px; border-radius: 999px; display: none; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 0 14px; }
  body.hud-collapsed #secondary, body.hud-collapsed #emotes, body.hud-collapsed #mixer { display: none; }
  body.hud-collapsed #hud { width: min(520px, calc(100% - 92px)); left: 12px; transform: none; }
  body.hud-collapsed #status { padding: 6px 10px; font-size: 12px; }
  body.hud-collapsed #actions { padding: 6px; gap: 4px; }
  body.hud-collapsed #actions .btn { padding: 8px 6px; font-size: 13px; }
  body.idle #hud, body.idle #hint, body.idle #title, body.idle #chatLog, body.idle #hudToggle { opacity: 0.18; }
  body.idle #hud:hover, body.idle #hud:focus-within { opacity: 1; }
  #hudToggle, #hint, #title, #chatLog { transition: opacity .6s; }
  @media (max-width: 720px), (max-height: 620px) {
    #hudToggle { display: flex; }
    #hint { display: none; }
    #moveHint { display: none; }
    .btn { min-width: 0; padding: 9px 8px; font-size: 13px; }
    .primaryRow { padding: 6px; gap: 4px; }
    #emotes { padding: 0 6px 6px; }
    #chatText { padding: 8px 10px; font-size: 13px; }
    #hud { gap: 6px; }
  }
  @media (max-width: 480px) {
    #gateArt { object-position: 50% 45%; }
  }
  body.cinema #hudToggle { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="숲속 모닥불 장면"></canvas>

<div id="gate" role="dialog" aria-label="모여봐요 찰스의 숲 시작 화면">
  <img id="gateArt" src="assets/keyart.jpg" alt="밤하늘 아래 호숫가 모닥불 앞에 모여 앉은 네 친구, 기타와 마시멜로, 텐트와 랜턴">
  <div id="gateBody">
    <div id="gateFallback">모여봐요<br>찰스의 숲</div>
    <p id="gateTag">숲속 호숫가 모닥불 앞에서 잠시 쉬어 가세요</p>
    <input id="gateName" type="text" maxlength="12" placeholder="숲에서 쓸 이름을 적어 주세요" autocomplete="nickname" aria-label="숲에서 쓸 이름">
    <p id="avatarTag">접속하실 캐릭터를 골라주세요</p>
    <div id="avatars" role="radiogroup" aria-label="접속하실 캐릭터를 골라주세요"></div>
    <button id="enter">Google 계정으로 입장</button>
    <p id="gateNote">Google 로그인한 사람끼리 모닥불을 나눠요 · 소리가 함께 켜집니다</p>
  </div>
</div>

<div id="title"><b>모여봐요 찰스의 숲</b> · 불멍</div>
<div id="presence" class="panel" aria-live="polite"><i></i><b id="presenceN">–</b><span>접속 중</span></div>
<div id="hint">드래그로 둘러보기 · 휠을 내리면 3인칭<br>WASD·방향키로 걷기 · 스페이스 점프 · H 메뉴 접기</div>

<div id="quote" aria-live="polite"><span id="quoteText"></span></div>
<div id="chatLog" aria-live="polite"></div>
<div id="hud">
  <form id="chat" class="panel" autocomplete="off">
    <input id="chatText" type="text" maxlength="60" placeholder="말풍선으로 이야기해요 · Enter" aria-label="채팅">
    <button class="btn primary" type="submit">보내기</button>
  </form>
  <div id="status" class="panel">
    <span>불 상태 <b id="stateName">적정 불</b></span>
    <span id="fuelBar"><i id="fuelFill"></i></span>
    <span id="online">혼자</span>
    <span id="sleepInfo" hidden></span>
  </div>
  <div class="panel">
    <div id="actions" class="primaryRow">
      <button class="btn primary" id="btnLog">장작 넣기</button>
      <button class="btn" id="btnAurora">오로라 가루</button>
      <button class="btn" id="btnCinema">불멍 모드</button>
      <button class="btn" id="btnWorry">고민 태우기</button>
    </div>
    <div id="secondary" class="primaryRow">
      <button class="btn" id="btnMelody">멜로디 끄기</button>
      <button class="btn" id="btnSound">소리 켜기</button>
    </div>
    <div id="emotes">
      <button class="emo" data-emote="👋" aria-label="손 흔들기">👋</button>
      <button class="emo" data-emote="🙂" aria-label="미소">🙂</button>
      <button class="emo" data-emote="❤️" aria-label="하트">❤️</button>
      <button class="emo" data-emote="🎵" aria-label="음표">🎵</button>
      <button class="emo" data-emote="😴" aria-label="졸림">😴</button>
      <span id="moveHint">바닥을 누르면 걷고, 통나무를 누르면 앉아요</span>
    </div>
    <details id="mixer">
      <summary><svg class="gear" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5-2.3-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg> 설정</summary>
      <div class="mix">
        <label for="myName">이름</label><input id="myName" type="text" maxlength="16" placeholder="숲속 이름">
        <label for="mFire">모닥불</label><input id="mFire" type="range" min="0" max="1" step="0.01" value="0.45">
        <label for="mCricket">밤벌레</label><input id="mCricket" type="range" min="0" max="1" step="0.01" value="0.35">
        <label for="mWind">바람</label><input id="mWind" type="range" min="0" max="1" step="0.01" value="0.25">
        <label for="mBgm">배경 음악</label><input id="mBgm" type="range" min="0" max="1" step="0.01" value="0.85">
        <label for="sleep">수면 타이머</label>
        <select id="sleep">
          <option value="0">끄기</option>
          <option value="15">15분</option>
          <option value="30">30분</option>
          <option value="60">60분</option>
        </select>
      </div>
    </details>
  </div>
</div>

<button class="btn panel" id="hudToggle" aria-label="메뉴 접기/펼치기" title="메뉴 접기/펼치기 (H)">MENU</button>
<button class="btn panel" id="exitCinema">화면을 누르거나 ESC · 불멍 모드 나가기</button>
<div id="dim"></div>

{

/* ================= 파티클 ================= */
class Particles {
  constructor(n, blending) {
    this.n = n;
    this.pos = new Float32Array(n * 3); this.vel = new Float32Array(n * 3); this.col = new Float32Array(n * 3);
    this.size = new Float32Array(n); this.size0 = new Float32Array(n); this.alpha = new Float32Array(n);
    this.life = new Float32Array(n); this.max = new Float32Array(n); this.seed = new Float32Array(n);
    this.next = 0;
    for (let i = 0; i < n; i++) this.seed[i] = Math.random() * 1000;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uMap: { value: softTex }, uScale: { value: 1 } },
      vertexShader: `
        attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
        varying vec3 vC; varying float vA; uniform float uScale;
        void main() {
          vC = aColor; vA = aAlpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * uScale / -mv.z;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform sampler2D uMap; varying vec3 vC; varying float vA;
        void main() {
          float a = texture2D(uMap, gl_PointCoord).a * vA;
          gl_FragColor = vec4(vC * a, a);
        }`,
      transparent: true, depthWrite: false, blending, premultipliedAlpha: true
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.geo = g;
  }
  spawn(x, y, z, vx, vy, vz, life, size) {
    const i = this.next; this.next = (i + 1) % this.n;
    const j = i * 3;
    this.pos[j] = x; this.pos[j + 1] = y; this.pos[j + 2] = z;
    this.vel[j] = vx; this.vel[j + 1] = vy; this.vel[j + 2] = vz;
    this.life[i] = life; this.max[i] = life; this.size0[i] = size; this.size[i] = size; this.alpha[i] = 0;
    return i;
  }
  update(dt, fn) {
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { this.alpha[i] = 0; continue; }
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.alpha[i] = 0; continue; }
      const j = i * 3;
      this.pos[j] += this.vel[j] * dt; this.pos[j + 1] += this.vel[j + 1] * dt; this.pos[j + 2] += this.vel[j + 2] * dt;
      fn(i, 1 - this.life[i] / this.max[i], j);
    }
    const a = this.geo.attributes;
    a.position.needsUpdate = a.aColor.needsUpdate = a.aSize.needsUpdate = a.aAlpha.needsUpdate = true;
  }
  setScale(s) { this.mat.uniforms.uScale.value = s; }
}
const fire = new Particles(900, THREE.AdditiveBlending);
const sparks = new Particles(300, THREE.AdditiveBlending);
const smoke = new Particles(400, THREE.NormalBlending);
smoke.points.renderOrder = 1; fire.points.renderOrder = 2; sparks.points.renderOrder = 3;
scene.add(smoke.points, fire.points, sparks.points);

function grad(stops, t, out) {
  const n = stops.length - 1;
  const s = clamp(t, 0, 0.9999) * n;
  const i = Math.floor(s), f = s - i;
  const a = stops[i], b = stops[i + 1];
  out[0] = a[0] + (b[0] - a[0]) * f; out[1] = a[1] + (b[1] - a[1]) * f; out[2] = a[2] + (b[2] - a[2]) * f;
}
const FIRE_STOPS = [[1, 0.96, 0.7], [1, 0.62, 0.15], [0.95, 0.25, 0.03], [0.4, 0.05, 0], [0.08, 0.01, 0]];
const SMOKE_STOPS = [[0.5, 0.33, 0.22], [0.36, 0.37, 0.42], [0.3, 0.32, 0.38]];
const tmp = [0, 0, 0];
const tmpColor = new THREE.Color();
const emit = { fire: 0, sparks: 0, smoke: 0 };

function updateParticles(dt) {
  const f = fuelF();
  const wind = Number($('#mWind').value) * 0.35;

  emit.fire += dt * (28 + 430 * f);
  while (emit.fire >= 1) {
    emit.fire--;
    const r = Math.sqrt(Math.random()) * (0.28 + 0.26 * f), a = rand(0, 6.283);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    fire.spawn(x, 0.18, z, -x * 0.4 + rand(-0.15, 0.15), rand(0.8, 1.6) * (0.55 + 0.85 * f), -z * 0.4 + rand(-0.15, 0.15), rand(0.5, 1.1) * (0.7 + 0.5 * f), rand(0.26, 0.5) * (0.7 + 0.5 * f));
  }
  emit.sparks += dt * (3 + 24 * f);
  while (emit.sparks >= 1) {
    emit.sparks--;
    sparks.spawn(rand(-0.2, 0.2), 0.4, rand(-0.2, 0.2), rand(-0.7, 0.7), rand(1.4, 3.4), rand(-0.7, 0.7), rand(0.6, 1.7), rand(0.045, 0.085));
  }
  emit.smoke += dt * (7 + 26 * (1 - f) + 10 * f);
  while (emit.smoke >= 1) {
    emit.smoke--;
    smoke.spawn(rand(-0.15, 0.15), 0.7 + 0.7 * f, rand(-0.15, 0.15), rand(-0.1, 0.1), rand(0.4, 0.8), rand(-0.1, 0.1), rand(3, 6), rand(0.3, 0.55));
  }

  const t0 = state.time;
  fire.update(dt, (i, t, j) => {
    fire.vel[j] += (-fire.pos[j] * 1.6 + Math.sin(t0 * 9 + fire.seed[i]) * 0.7) * dt;
    fire.vel[j + 2] += (-fire.pos[j + 2] * 1.6 + Math.cos(t0 * 8 + fire.seed[i]) * 0.7) * dt;
    fire.vel[j + 1] += 1.3 * dt;
    if (state.aurora > 0) {
      tmpColor.setHSL((t0 * 0.18 + fire.seed[i] * 0.01) % 1, 1, 0.58 - 0.4 * t);
      fire.col[j] = tmpColor.r; fire.col[j + 1] = tmpColor.g; fire.col[j + 2] = tmpColor.b;
    } else {
      grad(FIRE_STOPS, t, tmp);
      fire.col[j] = tmp[0]; fire.col[j + 1] = tmp[1]; fire.col[j + 2] = tmp[2];
    }
    fire.alpha[i] = Math.min(1, t / 0.12) * Math.pow(1 - t, 1.2);
    fire.size[i] = fire.size0[i] * (1.25 - t * 0.9);
  });
  sparks.update(dt, (i, t, j) => {
    sparks.vel[j + 1] -= 1.1 * dt;
    sparks.vel[j] += Math.sin(t0 * 6 + sparks.seed[i]) * 0.9 * dt;
    sparks.vel[j + 2] += Math.cos(t0 * 5 + sparks.seed[i]) * 0.9 * dt;
    const k = 1 - t;
    if (state.aurora > 0) {
      tmpColor.setHSL((t0 * 0.18 + sparks.seed[i] * 0.02) % 1, 1, 0.7);
      sparks.col[j] = tmpColor.r; sparks.col[j + 1] = tmpColor.g; sparks.col[j + 2] = tmpColor.b;
    } else {
      sparks.col[j] = 1; sparks.col[j + 1] = 0.72 * k + 0.1; sparks.col[j + 2] = 0.3 * k;
    }
    sparks.alpha[i] = k * (0.6 + 0.4 * Math.sin(t0 * 20 + sparks.seed[i]));
    sparks.size[i] = sparks.size0[i];
  });
  smoke.update(dt, (i, t, j) => {
    smoke.vel[j] += (wind + Math.sin(t0 * 0.8 + smoke.seed[i]) * 0.12) * dt;
    smoke.vel[j + 2] += Math.cos(t0 * 0.7 + smoke.seed[i]) * 0.1 * dt;
    grad(SMOKE_STOPS, t, tmp);
    const lit = t < 0.25 ? (1 + f * 1.2 * (1 - t / 0.25)) : 1;
    smoke.col[j] = tmp[0] * lit; smoke.col[j + 1] = tmp[1] * lit; smoke.col[j + 2] = tmp[2] * lit;
    smoke.alpha[i] = Math.sin(t * Math.PI) * 0.16;
    smoke.size[i] = smoke.size0[i] * (1 + 2.6 * t);
  });
}

/* ================= 장작 던지기 ================= */
const flying = [];
const throwGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.7, 7);
function throwLog(fromVec, addFuel = true) {
  const mesh = new THREE.Mesh(throwGeo, seatMat);
  const from = fromVec ? fromVec.clone() : camera.position.clone().add(new THREE.Vector3(0, -0.35, 0));
  mesh.position.copy(from);
  scene.add(mesh);
  flying.push({ mesh, t: 0, from, addFuel, to: new THREE.Vector3(rand(-0.15, 0.15), 0.35, rand(-0.15, 0.15)), spin: new THREE.Vector3(rand(2, 5), rand(1, 3), rand(2, 5)) });
}
function updateFlying(dt) {
  for (let i = flying.length - 1; i >= 0; i--) {
    const o = flying[i];
    o.t += dt / 0.75;
    const t = Math.min(1, o.t);
    o.mesh.position.lerpVectors(o.from, o.to, t);
    o.mesh.position.y += Math.sin(t * Math.PI) * 0.9;
    o.mesh.rotation.x += o.spin.x * dt; o.mesh.rotation.z += o.spin.z * dt;
    if (t >= 1) {
      scene.remove(o.mesh);
      flying.splice(i, 1);
      if (o.addFuel) state.fuel = Math.min(100, state.fuel + 22);
      burst(40, 0);
      audio.pop(1); setTimeout(() => audio.pop(0.8), 90); setTimeout(() => audio.pop(0.6), 220);
    }
  }
}
function burst(nSparks, nSmoke) {
  for (let i = 0; i < nSparks; i++) sparks.spawn(rand(-0.25, 0.25), 0.45, rand(-0.25, 0.25), rand(-1.6, 1.6), rand(1.5, 4.5), rand(-1.6, 1.6), rand(0.8, 1.8), rand(0.05, 0.1));
  for (let i = 0; i < nSmoke; i++) smoke.spawn(rand(-0.2, 0.2), 0.9, rand(-0.2, 0.2), rand(-0.3, 0.3), rand(0.6, 1.3), rand(-0.3, 0.3), rand(3, 6), rand(0.35, 0.6));
}

/* ================= 소리 (Web Audio 합성) ================= */
const PENTA = [130.8, 146.8, 164.8, 196, 220, 261.6, 293.7, 329.6, 392, 440, 523.3];
const audio = {
  ctx: null, started: false, g: {}, noteIdx: 5,
  start() {
    if (this.started) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = this.ctx = new C();
    this.started = true;
    this.master = ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(ctx.destination);

    const pink = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = pink.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913;
      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.12;
    }
    const white = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const wd = white.getChannelData(0);
    for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
    this.white = white;
    const loop = (buf) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };

    // 모닥불 바탕 소리
    const flp = ctx.createBiquadFilter(); flp.type = 'lowpass'; flp.frequency.value = 360;
    this.g.fire = ctx.createGain();
    loop(pink).connect(flp).connect(this.g.fire).connect(this.master);

    // 바람
    const wbp = ctx.createBiquadFilter(); wbp.type = 'bandpass'; wbp.frequency.value = 420; wbp.Q.value = 0.7;
    const lfo1 = ctx.createOscillator(); lfo1.frequency.value = 0.07;
    const lfo1g = ctx.createGain(); lfo1g.gain.value = 260; lfo1.connect(lfo1g).connect(wbp.frequency); lfo1.start();
    const swell = ctx.createGain(); swell.gain.value = 0.6;
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.11;
    const lfo2g = ctx.createGain(); lfo2g.gain.value = 0.35; lfo2.connect(lfo2g).connect(swell.gain); lfo2.start();
    this.g.wind = ctx.createGain();
    loop(pink).connect(wbp).connect(swell).connect(this.g.wind).connect(this.master);

    this.g.cricket = ctx.createGain(); this.g.cricket.connect(this.master);
    this.g.bgm = ctx.createGain(); this.g.bgm.connect(this.master);

    this.nextChirp = ctx.currentTime + 0.4;
    this.nextChirp2 = ctx.currentTime + 1.1;
    this.nextNote = ctx.currentTime + 1.5;
    this.nextPop = ctx.currentTime + 0.2;
    applyMixer();
    this.startScheduler();
  },
  tick() { /* 소리 예약은 startScheduler 의 타이머가 맡는다 */ },
  get running() { return this.started && this.ctx.state === 'running'; },
  pop(strength = 1, at = 0) {
    if (!this.running) return;
    const ctx = this.ctx, t = at || ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = this.white;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1200, 4800); bp.Q.value = 1.2;
    const g = ctx.createGain();
    const dur = rand(0.02, 0.07);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.5 * strength, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(bp).connect(g).connect(this.g.fire);
    s.start(t, rand(0, 0.8), dur + 0.02);
  },
  chirp(t0) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = rand(3900, 4700);
    const g = ctx.createGain(); g.gain.value = 0;
    const n = 4 + Math.floor(rand(0, 6));
    for (let k = 0; k < n; k++) {
      const ts = t0 + k * 0.036;
      g.gain.setValueAtTime(0, ts);
      g.gain.linearRampToValueAtTime(1, ts + 0.006);
      g.gain.linearRampToValueAtTime(0, ts + 0.026);
    }
    osc.connect(g).connect(this.g.cricket);
    osc.start(t0); osc.stop(t0 + n * 0.036 + 0.05);
  },
  pluck(freq, t, dest, { type = 'triangle', vol = 0.25, dur = 2.4, bright = 1800 } = {}) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(bright, t);
    lp.frequency.exponentialRampToValueAtTime(280, t + dur * 0.6);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    osc.connect(lp).connect(g).connect(dest);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  // 소리 예약은 화면 루프가 아니라 타이머로: 탭이 가려져도 2.5초 앞까지 미리 잡아 둔다
  phraseLeft: 0, nextPop: 0,
  startScheduler() {
    if (this.schedTimer) return;
    this.schedTimer = setInterval(() => this.schedule(), 250);
    this.schedule();
  },
  schedule() {
    if (!this.running) return;
    const ctx = this.ctx, now = ctx.currentTime, ahead = now + 2.5;
    if (this.nextPop < now) this.nextPop = now;
    while (this.nextPop < ahead) { this.pop(0.3 + 0.7 * fuelF(), this.nextPop); this.nextPop += rand(0.03, 1.2) / (0.25 + fuelF()); }
    if (this.nextChirp < now) this.nextChirp = now;
    if (this.nextChirp2 < now) this.nextChirp2 = now;
    if (this.nextNote < now) this.nextNote = now;
    while (ahead > this.nextChirp) { this.chirp(this.nextChirp); this.nextChirp += rand(0.45, 1.7); }
    while (ahead > this.nextChirp2) { this.chirp(this.nextChirp2); this.nextChirp2 += rand(0.9, 2.6); }
    while (ahead > this.nextNote) {
      if (!state.melody) { this.nextNote = now + 0.5; break; }
      if (this.phraseLeft <= 0) {
        this.phraseLeft = 3 + Math.floor(rand(0, 5));
        this.noteIdx = clamp(this.noteIdx + Math.round(rand(-3, 3)), 2, PENTA.length - 1);
      }
      this.noteIdx = clamp(this.noteIdx + Math.round(rand(-1.6, 1.6)), 0, PENTA.length - 1);
      this.pluck(PENTA[this.noteIdx], this.nextNote, this.g.bgm);
      if (Math.random() < 0.25) this.pluck(PENTA[Math.max(0, this.noteIdx - 4)], this.nextNote + 0.02, this.g.bgm, { vol: 0.12, dur: 3 });
      this.phraseLeft--;
      this.nextNote += this.phraseLeft > 0 ? rand(0.45, 1.1) : rand(2.5, 5);
    }
  },
  toggle() {
    if (!this.started) { this.start(); if (this.ctx) this.ctx.resume(); setTimeout(updateSoundButton, 60); return; }
    if (!this.ctx) return;
    if (this.ctx.state === 'running') this.ctx.suspend(); else this.ctx.resume();
    setTimeout(updateSoundButton, 60);
  }
};

const keys = new Set();
const KEYMAP = { KeyW: [0, 1], ArrowUp: [0, 1], KeyS: [0, -1], ArrowDown: [0, -1], KeyA: [1, 0], ArrowLeft: [1, 0], KeyD: [-1, 0], ArrowRight: [-1, 0] };
function keyWalk(dt) {
  let f = 0, r = 0;
  for (const k of keys) { const m = KEYMAP[k]; if (m) { r += m[0]; f += m[1]; } }
  if (!f && !r) return;
  const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  let x = me.pos.x + (sy * f + cy * r) * 0.5;
  let z = me.pos.z + (cy * f - sy * r) * 0.5;
  const rr = Math.hypot(x, z);
  if (rr < 1.3) { x = x / rr * 1.3; z = z / rr * 1.3; }
  if (rr > 9) { x = x / rr * 9; z = z / rr * 9; }
  me.walkTo(x, z);
}

const clearOf = (x, z, r) => Math.hypot(x, z) > r;

// 충돌용 원(나무·바위·텐트 등). 사람·동물은 매 프레임 이 원 밖으로 밀려난다
const obstacles = [];
const addObstacle = (x, z, r) => obstacles.push({ x, z, r });
function scatter(model, count, rMin, rMax, sMin, sMax, opts = {}) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), r = rand(rMin, rMax);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (z < -11 && !opts.lakeOk) { i--; continue; }
    const m = model.clone();
    const s = rand(sMin, sMax);
    m.position.set(x, 0, z);
    m.rotation.y = rand(0, 6.28);
    m.scale.setScalar(s);
    scene.add(m);
    if (opts.hit) addObstacle(x, z, opts.hit * s);
  }
}
function resolveCircle(pos, radius, skipSelf) {
  let pushed = false;
  const push = (ox, oz, orad) => {
    const dx = pos.x - ox, dz = pos.z - oz;
    const d = Math.hypot(dx, dz), min = radius + orad;
    if (d >= min || d < 1e-4) return;
    pos.x += dx / d * (min - d); pos.z += dz / d * (min - d);
    pushed = true;
  };
  for (const o of obstacles) push(o.x, o.z, o.r);
  for (const ch of allChars) { if (ch === skipSelf || !ch.group.visible && !ch.isMe) continue; push(ch.pos.x, ch.pos.z, 0.38); }
  for (const an of animals) { if (an === skipSelf) continue; push(an.pos.x, an.pos.z, 0.3); }
  return pushed;
}
const insideObstacle = (x, z, pad = 0) => obstacles.some((o) => Math.hypot(x - o.x, z - o.z) < o.r + pad);

async function buildForest() {
  const names = ['tree', 'tree-high', 'tent', 'rocks-low', 'rocks-high', 'stones', 'plant', 'patch-grass', 'fence', 'flag'];
  const g = {};
  await Promise.all(names.map(async (n) => { g[n] = (await loadGLB(FOREST + n + '.glb')).scene; }));
  procGroup.visible = false;
  obstacles.length = 0;
  scatter(g['tree'], 55, 7.5, 45, 2.0, 3.0, { hit: 0.22 });
  scatter(g['tree-high'], 35, 9, 45, 2.2, 3.4, { hit: 0.22 });
  scatter(g['rocks-low'], 10, 6, 30, 1.2, 2.2, { hit: 0.45 });
  scatter(g['rocks-high'], 5, 12, 35, 1.4, 2.4, { hit: 0.45 });
  scatter(g['stones'], 12, 4.5, 20, 1.0, 1.8, { hit: 0.35 });
  scatter(g['plant'], 40, 3.2, 16, 1.6, 2.6);
  scatter(g['patch-grass'], 30, 3.5, 18, 1.5, 2.5);
  const tent = g['tent'].clone(); tent.position.set(-4.8, 0, -0.6); tent.rotation.y = 0.55; tent.scale.setScalar(2.6); scene.add(tent);
  addObstacle(-4.8, -0.6, 1.5);
  const flag = g['flag'].clone(); flag.position.set(-3.2, 0, -2.2); flag.scale.setScalar(2.2); scene.add(flag);
  addObstacle(-3.2, -2.2, 0.2);
  for (let i = 0; i < 4; i++) { const fx = 4.2 + i * 1.1 * 0.9, fz = -3.4 + i * 0.55; const f = g['fence'].clone(); f.position.set(fx, 0, fz); f.rotation.y = -0.5; f.scale.setScalar(2.0); scene.add(f); addObstacle(fx, fz, 0.55); }
}

async function buildAnimals() {
  const loaded = animalGLTF;
  await Promise.all(ANIMALS.map(async (n) => { loaded[n] = await loadGLB(PETS + 'animal-' + n + '.glb'); }));
  for (const ch of allChars) ch.attachModel();
  const picks = [...ANIMALS].sort(() => Math.random() - 0.5).slice(0, 9).concat(['fox', 'bunny', 'deer']);
  for (const n of picks) {
    const src = loaded[n];
    const model = src.scene.clone();
    const s = rand(0.28, 0.36);
    model.scale.setScalar(s);
    let x, z;
    do { const a = rand(0, Math.PI * 2), r = rand(3.6, 9); x = Math.cos(a) * r; z = Math.sin(a) * r; } while (z < -10);
    model.position.set(x, 0.3 * s, z);
    model.rotation.y = rand(0, 6.28);
    scene.add(model);
    const mixer = new THREE.AnimationMixer(model);
    const clips = {};
    for (const c of src.animations) clips[c.name] = mixer.clipAction(c);
    const an = { model, mixer, clips, s, pos: model.position, target: new THREE.Vector3(x, 0, z), state: 'idle', timer: rand(1, 6), cur: null, speed: rand(0.55, 0.9), seed: rand(0, 1000) };
    animalPlay(an, 'idle');
    animals.push(an);
  }
}
function animalPlay(an, name) {
  const next = an.clips[name] || an.clips.idle;
  if (!next || an.cur === next) return;
  next.reset().setEffectiveTimeScale(name === 'walk' ? 1.2 : 1).fadeIn(0.25).play();
  if (an.cur) an.cur.fadeOut(0.25);
  an.cur = next;
}
function updateAnimals(dt) {
  for (const an of animals) {
    an.mixer.update(dt);
    an.timer -= dt;
    if (state.aurora > 0) { if (an.state !== 'dance') { an.state = 'dance'; animalPlay(an, 'dance'); } continue; }
    if (an.state === 'dance') { an.state = 'idle'; an.timer = rand(1, 3); animalPlay(an, 'idle'); }
    if (an.state === 'walk') {
      const dx = an.target.x - an.pos.x, dz = an.target.z - an.pos.z, d = Math.hypot(dx, dz);
      if (d < 0.08) { an.state = Math.random() < 0.4 ? 'eat' : 'idle'; an.timer = rand(2, 7); animalPlay(an, an.state); continue; }
      const step = Math.min(d, an.speed * dt);
      an.pos.x += dx / d * step; an.pos.z += dz / d * step;
      an.model.rotation.y += wrapAngle(Math.atan2(dx, dz) - an.model.rotation.y) * Math.min(1, dt * 6);
      if (resolveCircle(an.pos, 0.3, an) && insideObstacle(an.target.x, an.target.z, 0.3)) { an.state = 'idle'; an.timer = rand(0.5, 2); animalPlay(an, 'idle'); }
    } else if (an.timer <= 0) {
      let tx, tz, tries = 0;
      do { const a = rand(0, Math.PI * 2), r = rand(1.5, 4); tx = an.pos.x + Math.cos(a) * r; tz = an.pos.z + Math.sin(a) * r; tries++; }
      while ((!clearOf(tx, tz, 3.2) || Math.hypot(tx, tz) > 10 || tz < -10 || insideObstacle(tx, tz, 0.3)) && tries < 12);
      if (tries < 12) { an.target.set(tx, 0, tz); an.state = 'walk'; animalPlay(an, 'walk'); }
      else an.timer = rand(1, 3);
    } else {
      // 쉴 때는 천천히 모닥불 쪽을 본다 (Kenney 모델 정면은 +Z, 모델 데이터로 확인)
      an.model.rotation.y += wrapAngle(Math.atan2(-an.pos.x, -an.pos.z) - an.model.rotation.y) * Math.min(1, dt * 1.5);
    }
  }
}
buildForest().catch((e) => console.warn('숲 모델 읽기 실패, 기본 숲 유지', e));
buildAnimals().catch((e) => console.warn('동물 모델 읽기 실패', e));

// 사람 캐릭터(Kenney Mini Forest 궁수 + Mini Characters 12명): 옷 색을 8가지 색조로 돌려 서로 구분
const CHARS = 'assets/models/chars/';
const HUMANS = ['archer', 'female-a', 'female-b', 'female-c', 'female-d', 'female-e', 'female-f', 'male-a', 'male-b', 'male-c', 'male-d', 'male-e', 'male-f'];
const HUMAN_LABEL = { archer: '궁수', 'female-a': '여성 A', 'female-b': '여성 B', 'female-c': '여성 C', 'female-d': '여성 D', 'female-e': '여성 E', 'female-f': '여성 F', 'male-a': '남성 A', 'male-b': '남성 B', 'male-c': '남성 C', 'male-d': '남성 D', 'male-e': '남성 E', 'male-f': '남성 F' };
const ANIMAL_LABEL = { fox: '여우', bunny: '토끼', deer: '사슴', cat: '고양이', dog: '강아지', chick: '병아리', koala: '코알라', panda: '판다', penguin: '펭귄', pig: '돼지', polar: '북극곰', beaver: '비버' };
const humanGLTF = {}, humanLoading = {};
const hueSets = new Map();
const HUE_SHIFTS = [0, 45, 90, 135, 180, 225, 270, 315];
function hueTexture(image, deg) {
  const c = document.createElement('canvas'); c.width = image.width; c.height = image.height;
  const g = c.getContext('2d');
  g.filter = `hue-rotate(${deg}deg)`;
  g.drawImage(image, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  return t;
}
// 사람 모델은 고른 것만 읽는다 (13명 전부 받으면 3MB)
function loadHuman(name) {
  if (humanGLTF[name]) return Promise.resolve(humanGLTF[name]);
  if (!humanLoading[name]) {
    const path = name === 'archer' ? FOREST + 'character-archer.glb' : CHARS + 'character-' + name + '.glb';
    humanLoading[name] = loadGLB(path).then((gltf) => {
      let baseMat = null;
      gltf.scene.traverse((o) => { if (o.isMesh && !baseMat) baseMat = o.material; });
      const img = baseMat && baseMat.map && baseMat.map.image;
      if (!img) throw new Error('colormap 없음');
      if (!hueSets.has(img)) hueSets.set(img, HUE_SHIFTS.map((d) => hueTexture(img, d)));
      gltf.bodyTex = hueSets.get(img);
      humanGLTF[name] = gltf;
      for (const ch of allChars) if (ch.avatar === name) ch.attachModel();
      return gltf;
    }).catch((e) => { console.warn('사람 모델 읽기 실패, 기본 캐릭터 유지', name, e); delete humanLoading[name]; });
  }
  return humanLoading[name];
}
function hueIndexOf(color) {
  const i = PALETTE.indexOf(color);
  if (i >= 0) return i % HUE_SHIFTS.length;
  let h = 0; for (const c of String(color)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % HUE_SHIFTS.length;
}

/* ================= 별똥별 ================= */
const meteors = [];
const meteorMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
for (let i = 0; i < 3; i++) {
  const N = 16;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3).setUsage(THREE.DynamicDrawUsage));
  const col = new Float32Array(N * 3);
  for (let k = 0; k < N; k++) { const b = Math.pow(1 - k / N, 2); col.set([b, b * 0.95, b * 0.8], k * 3); }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const line = new THREE.Line(geo, meteorMat); line.visible = false; line.frustumCulled = false;
  const head = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xfff4d6, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  head.scale.setScalar(5); head.visible = false;
  scene.add(line, head);
  meteors.push({ line, head, N, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, max: 1, hist: [] });
}
let nextMeteor = 4;
function launchMeteor() {
  const m = meteors.find((x) => x.life <= 0);
  if (!m) return;
  const R = 470;
  const a = rand(0, Math.PI * 2), el = rand(0.35, 1.1);
  m.pos.set(Math.cos(a) * Math.cos(el) * R, Math.sin(el) * R, Math.sin(a) * Math.cos(el) * R);
  const side = new THREE.Vector3(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(rand(-1, 1));
  m.vel.copy(side).add(new THREE.Vector3(0, -rand(0.5, 1.2), 0)).normalize().multiplyScalar(rand(220, 380));
  m.max = m.life = rand(0.7, 1.4);
  m.hist = [];
  m.line.visible = m.head.visible = true;
}
function updateMeteors(dt) {
  nextMeteor -= dt;
  if (nextMeteor <= 0) { launchMeteor(); if (Math.random() < 0.2) setTimeout(launchMeteor, 300); nextMeteor = rand(5, 16); }
  for (const m of meteors) {
    if (m.life <= 0) continue;
    m.life -= dt;
    m.pos.addScaledVector(m.vel, dt);
    m.hist.unshift(m.pos.clone());
    if (m.hist.length > m.N) m.hist.length = m.N;
    const arr = m.line.geometry.attributes.position.array;
    for (let k = 0; k < m.N; k++) { const p = m.hist[Math.min(k, m.hist.length - 1)]; arr[k * 3] = p.x; arr[k * 3 + 1] = p.y; arr[k * 3 + 2] = p.z; }
    m.line.geometry.attributes.position.needsUpdate = true;
    const f = Math.min(1, m.life / 0.3);
    meteorMat.opacity = 1;
    m.head.position.copy(m.pos);
    m.head.material.opacity = f;
    m.head.scale.setScalar(4 + 3 * f);
    if (m.life <= 0) { m.line.visible = m.head.visible = false; }
  }
}

/* ================= 캐릭터 ================= */
const PALETTE = ['#f28ca0', '#7fc8f8', '#ffd166', '#9bde7e', '#c9a7eb', '#ffa07a', '#8ed1c1', '#f5b5e0'];
const ADJ = ['고요한', '졸린', '따뜻한', '느긋한', '포근한', '반짝이는', '조용한', '살금살금', '몽글몽글', '나른한'];
const ANIMAL = ['여우', '곰', '토끼', '수달', '고라니', '부엉이', '다람쥐', '너구리', '사슴', '고양이'];
const pick = (a) => a[Math.floor(rand(0, a.length))];
const randomName = () => pick(ADJ) + ' ' + pick(ANIMAL);
const bodyGeo = new THREE.CapsuleGeometry(0.2, 0.42, 4, 10);
const headGeo = new THREE.SphereGeometry(0.19, 14, 12);
const hatGeo = new THREE.SphereGeometry(0.205, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2);
const skinMat = new THREE.MeshStandardMaterial({ color: 0xf3d2b3, roughness: 0.9 });
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const labelsEl = $('#labels');
const projV = new THREE.Vector3();
const allChars = new Set();
const normalizeAvatar = (av) => (ANIMALS.includes(av) || HUMANS.includes(av)) ? av : 'archer';
const ARCHER_SCALE = 1.6;

class Character {
  constructor(color, isMe, avatar = 'human') {
    this.group = new THREE.Group();
    this.color = color;
    this.avatar = normalizeAvatar(avatar);
    this.eyeY = 1.05; this.seatY = 0.3;
    this.mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85 });
    this.body = new THREE.Mesh(bodyGeo, this.mat); this.body.position.y = 0.45;
    this.head = new THREE.Mesh(headGeo, skinMat); this.head.position.y = 0.96;
    this.hat = new THREE.Mesh(hatGeo, this.mat); this.hat.position.y = 1.0;
    this.capsule = new THREE.Group(); this.capsule.add(this.body, this.head, this.hat);
    this.group.add(this.capsule);
    scene.add(this.group);
    this.pos = new THREE.Vector3(); this.target = new THREE.Vector3();
    this.seat = -1; this.yaw = 0; this.walkT = 0; this.isMe = isMe; this.jumpY = 0; this.vy = 0;
    this.model = null; this.mixer = null; this.clips = {}; this.cur = null; this.anim = '';
    allChars.add(this);
    this.attachModel();
    this.tag = document.createElement('div');
    this.tag.className = 'tag';
    this.tag.innerHTML = `<div class="bb"></div><div class="em"></div><div class="nm${isMe ? ' me' : ''}"></div>`;
    labelsEl.appendChild(this.tag);
    this.bb = this.tag.querySelector('.bb'); this.em = this.tag.querySelector('.em'); this.nm = this.tag.querySelector('.nm');
  }
  setName(n) { this.nm.textContent = n; }
  setColor(c) { this.color = c; this.mat.color.set(c); if (this.bodyMat && this.bodyTexSet) this.bodyMat.map = this.bodyTexSet[hueIndexOf(c)]; }
  attachModel() {
    if (this.model) return;
    let m, anims;
    if (HUMANS.includes(this.avatar)) {
      const src = humanGLTF[this.avatar];
      if (!src) { loadHuman(this.avatar); return; }
      m = SkeletonUtils.clone(src.scene);
      m.scale.setScalar(ARCHER_SCALE);
      this.bodyTexSet = src.bodyTex;
      m.traverse((o) => {
        if (!o.isMesh) return;
        o.frustumCulled = false;
        if (o.name === 'body-mesh') { this.bodyMat = o.material.clone(); this.bodyMat.map = this.bodyTexSet[hueIndexOf(this.color)]; o.material = this.bodyMat; }
      });
      anims = src.animations;
      this.eyeY = 1.12; this.seatY = 0.42; this.isAnimal = false;
    } else {
      const src = animalGLTF[this.avatar];
      if (!src) return;
      m = src.scene.clone();
      const s = 0.44;
      m.scale.setScalar(s);
      m.position.y = 0.3 * s;
      m.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
      anims = src.animations;
      this.eyeY = 0.78; this.seatY = 0.44; this.isAnimal = true;
    }
    m.rotation.y = 0; // Kenney 모델 정면은 +Z (머리·꼬리 좌표로 확인)
    this.model = m;
    this.capsule.visible = false;
    this.group.add(m);
    this.mixer = new THREE.AnimationMixer(m);
    for (const c of anims) this.clips[c.name] = this.mixer.clipAction(c);
    this.play('idle');
  }
  setAvatar(av) {
    av = normalizeAvatar(av);
    if (av === this.avatar && this.model) return;
    if (this.model) { this.group.remove(this.model); this.mixer.stopAllAction(); }
    this.model = null; this.mixer = null; this.clips = {}; this.cur = null; this.anim = ''; this.bodyMat = null; this.bodyTexSet = null;
    this.avatar = av; this.eyeY = 1.05; this.seatY = 0.3; this.isAnimal = false;
    this.capsule.visible = true;
    this.attachModel();
  }
  play(name, once = false) {
    const next = this.clips[name];
    if (!next || this.anim === name) return;
    next.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity).setEffectiveTimeScale(name === 'walk' ? 1.4 : 1).fadeIn(0.18).play();
    if (this.cur) this.cur.fadeOut(0.18);
    this.cur = next; this.anim = name;
  }
  place(x, z) { this.pos.set(x, 0, z); this.target.copy(this.pos); this.group.position.copy(this.pos); }
  walkTo(x, z) { this.seat = -1; this.target.set(x, 0, z); }
  sit(i) { const s = SEATS[i]; if (!s) return; this.seat = i; this.target.set(s.x, 0, s.z); }
  jump() { if (this.jumpY > 0) return; this.vy = 3.4; this.jumpY = 0.001; if (this.seat >= 0) { this.seat = -1; this.target.copy(this.pos); } }
  say(text) { this.bb.textContent = text; this.bb.classList.remove('on'); void this.bb.offsetWidth; this.bb.classList.add('on'); }
  emote(e) {
    this.em.textContent = e; this.em.classList.remove('on'); void this.em.offsetWidth; this.em.classList.add('on');
    if (this.model && this.seat < 0 && this.jumpY <= 0) {
      this.emoteUntil = state.time + 1.6;
      if (this.isAnimal) this.play(e === '🎵' ? 'dance' : e === '😴' ? 'eat' : 'gesture-positive');
      else this.play(e === '😴' ? 'crouch' : 'emote-yes');
    }
  }
  headWorld() { return new THREE.Vector3(this.pos.x, this.group.position.y + this.eyeY - 0.1, this.pos.z); }
  update(dt) {
    const dx = this.target.x - this.pos.x, dz = this.target.z - this.pos.z;
    const dist = Math.hypot(dx, dz);
    const moving = dist > 0.03;
    if (moving) {
      const step = Math.min(dist, 1.7 * dt);
      this.pos.x += dx / dist * step; this.pos.z += dz / dist * step;
      this.yaw = Math.atan2(dx, dz);
      this.walkT += dt * 9;
    }
    const seated = this.seat >= 0 && !moving;
    if (seated) this.yaw = Math.atan2(-this.pos.x, -this.pos.z);
    if (this.jumpY > 0) { this.vy -= 9.8 * dt; this.jumpY += this.vy * dt; if (this.jumpY <= 0) { this.jumpY = 0; this.vy = 0; } }
    const baseY = this.model ? (seated ? this.seatY : 0) : (seated ? 0.3 : (moving ? Math.abs(Math.sin(this.walkT)) * 0.05 : 0));
    this.group.position.set(this.pos.x, baseY + this.jumpY, this.pos.z);
    this.group.rotation.y += wrapAngle(this.yaw - this.group.rotation.y) * Math.min(1, dt * 10);
    if (this.model) {
      this.mixer.update(dt);
      if (this.isAnimal) {
        if (moving) this.play('walk');
        else if (!(this.emoteUntil > state.time)) this.play('idle');
      } else if (this.jumpY > 0) this.play('jump');
      else if (seated) this.play('sit');
      else if (moving) this.play('walk');
      else if (!(this.emoteUntil > state.time)) this.play('idle');
    } else {
      this.body.scale.y += ((seated ? 0.72 : 1) - this.body.scale.y) * Math.min(1, dt * 8);
    }
    projV.set(this.pos.x, this.group.position.y + this.eyeY + 0.15, this.pos.z).project(camera);
    if (projV.z > 1 || projV.z < -1 || (this.isMe && !this.group.visible)) { this.tag.style.display = 'none'; return; }
    this.tag.style.display = '';
    const x = (projV.x + 1) / 2 * innerWidth, y = (1 - projV.y) / 2 * innerHeight;
    this.tag.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
  }
  dispose() { scene.remove(this.group); this.tag.remove(); allChars.delete(this); }
}

// 기본 욕설 필터: 글자 사이 공백·기호를 끼워 넣어도 잡고, 맞는 부분만 ●로 가린다

// 드래그 → 둘러보기, 휠·핀치 → 1인칭↔3인칭, 바닥 탭 → 걷기, 통나무 탭 → 앉기
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pdown = null;
const pointers = new Map();
let pinchDist = 0;
canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    pdown = null;
    return;
  }
  pdown = { x: e.clientX, y: e.clientY, t: performance.now() };
});
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist) cam.distTarget = clamp(cam.distTarget + (pinchDist - d) * 0.02, 0, cam.maxDist);
    pinchDist = d;
    return;
  }
  if (state.cinema) return;
  cam.yaw -= dx * 0.005;
  cam.tilt += dy * 0.004;
});
const endPointer = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinchDist = 0; };
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (state.cinema) return;
  cam.distTarget = clamp(cam.distTarget + e.deltaY * 0.006, 0, cam.maxDist);
}, { passive: false });
canvas.addEventListener('pointerup', (e) => {
  endPointer(e);
  if (!pdown || state.cinema || performance.now() - (state.cinemaExitAt || 0) < 600) { pdown = null; return; }
  const moved = Math.hypot(e.clientX - pdown.x, e.clientY - pdown.y);
  const held = performance.now() - pdown.t;
  pdown = null;
  if (moved > 8 || held > 400) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const logHit = raycaster.intersectObjects(seatLogs, false)[0];
  if (logHit) {
    const li = logHit.object.userData.log;
    const cands = SEATS.map((s, i) => ({ s, i })).filter(({ s, i }) => s.log === li && !seatTakenBy(i));
    if (!cands.length) { toast('이 통나무는 자리가 찼어요'); return; }
    cands.sort((a, b) => Math.hypot(a.s.x - logHit.point.x, a.s.z - logHit.point.z) - Math.hypot(b.s.x - logHit.point.x, b.s.z - logHit.point.z));
    me.sit(cands[0].i);

    net.updateMe({ x: me.target.x, z: me.target.z, seat: me.seat });
    return;
  }
  const g = raycaster.intersectObject(ground, false)[0];
  if (!g) return;
  let x = g.point.x, z = g.point.z;
  const r = Math.hypot(x, z);
  if (r < 1.3) { x = x / r * 1.3; z = z / r * 1.3; }
  if (r > 9) { x = x / r * 9; z = z / r * 9; }
  if (insideObstacle(x, z, 0.38)) { toast('거기는 갈 수 없어요'); return; }

const clock = new THREE.Clock();

const camHead = new THREE.Vector3(), camDir = new THREE.Vector3(), camGoal = new THREE.Vector3(), camLook = new THREE.Vector3();
let camInit = false;

function updateCamera(dt) {
  cam.dist += (cam.distTarget - cam.dist) * Math.min(1, dt * 8);
  const third = cam.thirdPerson;
  cam.tilt = third ? clamp(cam.tilt, 0.05, 1.25) : clamp(cam.tilt, -0.7, 0.7);
  const seated = me.seat >= 0 && Math.hypot(me.target.x - me.pos.x, me.target.z - me.pos.z) < 0.05;
  camHead.set(me.pos.x, (seated ? me.seatY : 0) + me.eyeY + me.jumpY, me.pos.z);
  if (third) {
    const h = Math.cos(cam.tilt) * cam.dist, v = Math.sin(cam.tilt) * cam.dist;
    camGoal.set(camHead.x - Math.sin(cam.yaw) * h, camHead.y + v, camHead.z - Math.cos(cam.yaw) * h);
    if (camGoal.y < 0.25) camGoal.y = 0.25;
    camLook.set(camHead.x, camHead.y + 0.1, camHead.z);
  } else {
    camGoal.copy(camHead);
    camDir.set(Math.sin(cam.yaw) * Math.cos(cam.tilt), -Math.sin(cam.tilt), Math.cos(cam.yaw) * Math.cos(cam.tilt));
    camLook.copy(camHead).add(camDir);
  }
  if (!camInit) { camera.position.copy(camGoal); camInit = true; }
  else camera.position.lerp(camGoal, 1 - Math.pow(0.0005, dt));
  camera.lookAt(camLook);
  me.group.visible = cam.dist > 0.3;
  if (!third) me.yaw = cam.yaw;
}

  fireLight.position.set(Math.sin(state.time * 7) * 0.06, 0.65 + 0.5 * f, Math.cos(state.time * 6) * 0.06);
  if (state.aurora > 0) fireLight.color.setHSL((state.time * 0.18) % 1, 0.85, 0.6);
  else fireLight.color.copy(lightLow).lerp(lightHigh, f);
  glow.material.color.copy(fireLight.color);
  glow.material.opacity = (0.12 + 0.3 * f) * flick;
  glow.scale.setScalar(1.6 + 2.2 * f);
  glow.position.y = 0.5 + 0.5 * f;
  logMat.emissiveIntensity = (0.15 + 1.4 * f) * flick;

  updateParticles(dt);
  updateFlying(dt);
  audio.tick(dt);
  me.update(dt);
  // 충돌: 나무·바위·텐트·다른 사람·동물 밖으로 밀어내기 (앉아 있을 땐 제외)
  if (me.seat < 0 && resolveCircle(me.pos, 0.38, me) && insideObstacle(me.target.x, me.target.z, 0.38)) me.target.copy(me.pos);
  for (const [, o] of others) o.ch.update(dt);
  net.tick(dt);
  updateAnimals(dt);
  updateMeteors(dt);

  if (state.sleepEnd) {
    const rem = state.sleepEnd - Date.now();
    if (audio.started) audio.master.gain.value = 0.9 * clamp(rem / 60000, 0, 1);
    if (rem <= 0) {
      state.sleepEnd = 0;
      $('#sleep').value = '0';
      $('#sleepInfo').hidden = true;
      if (audio.ctx) audio.ctx.suspend();
      updateSoundButton();
      toast('잘 자요. 불은 제가 지키고 있을게요', 5000);
    }
  }

  if (state.cinema) {
    const a = state.cinemaAngle + Math.sin(state.time * 0.07) * 0.35;
    cinemaTarget.set(Math.sin(a) * 2.3, 0.95 + Math.sin(state.time * 0.11) * 0.08, Math.cos(a) * 2.3);
    camera.position.lerp(cinemaTarget, 1 - Math.pow(0.002, dt));
    camera.lookAt(0, 0.65, 0);
    me.group.visible = true;
  } else {
    keyWalk(dt);
    updateCamera(dt);
  }

  state.uiTick += dt;
  if (state.uiTick > 0.25) { state.uiTick = 0; updateUI(); }

  renderer.render(scene, camera);
}
updateUI();
frame();
// 점검용 (콘솔에서 상태 확인)
window.charlesForest = { state, cam, me, animals, meteors, launchMeteor, audio, obstacles, showQuote };
</script>

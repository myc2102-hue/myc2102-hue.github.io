<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>촬스의 숲 · 오프라인</title>
<style>
  html, body { margin: 0; height: 100%; background: #03070c; color: #e8eef2; font-family: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: #a9b6bf; font-size: 14px; line-height: 1.6; }
  button { margin-top: 8px; padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: inherit; font: inherit; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>숲으로 가는 길이 끊겼어요</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>숲은 다른 사람들과 함께하는 곳이라 연결이 있어야 들어갈 수 있어요.</p>
  <button type="button" onclick="location.replace('/')">다시 시도</button>
</main>
</body>
</html>
